name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and publish plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Pre-flight - validate composer manifest and build invocations
        run: |
          set -euo pipefail
          # 1. Manifest sanity (no publish checks; this plugin isn't on Packagist).
          composer validate --strict --no-check-publish
          # 2. Shell parse check on the build script.
          bash -n bin/build.sh
          # 3. Dry-run the exact composer commands the build uses, in a throwaway
          #    copy, so an invalid flag/constraint fails here instead of mid-build.
          #    Keep these flags in sync with bin/build.sh.
          tmp="$(mktemp -d)"
          cp composer.json composer.lock "${tmp}/"
          composer install --working-dir="${tmp}" --no-dev --classmap-authoritative \
            --optimize-autoloader --dry-run --no-interaction --no-progress
          composer require yahnis-elsts/plugin-update-checker:^5.6 \
            --working-dir="${tmp}" --update-no-dev --classmap-authoritative \
            --optimize-autoloader --dry-run --no-interaction --no-progress

      - name: Build plugin zip (GitHub dogfood channel, with self-updater)
        run: bash bin/build.sh --with-updater

      - name: Verify git tag matches plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(ls build/domain-monitor-*.zip)"
          version="$(basename "${file}" .zip | sed 's/^domain-monitor-//')"
          if [ "${tag}" != "${version}" ]; then
            echo "error: git tag '${tag}' != plugin version '${version}'" >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/domain-monitor-*.zip
          generate_release_notes: true
